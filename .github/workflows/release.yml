name: Release General

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: Release tarball
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Creating Makefiles ...
        run: |
          ./autogen.sh
          ./configure --prefix=
      - name: Build release ...
        run: |
          make distcheck
          mkdir -p artifacts/
          mv *.tar.* artifacts/
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  debian:
    name: Debian package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installing dependencies ...
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential libncurses-dev autoconf automake \
          		          dpkg-dev debhelper devscripts
      - name: Build Debian package ...
        run: |
          ver=${GITHUB_REF_NAME#v}
          deb=$(dpkg-parsechangelog -S Version)
          if [ "$deb" != "$ver" ]; then
              echo "debian/changelog is at $deb, tag says $ver"
              exit 1
          fi
          ./autogen.sh
          ./configure
          make package
          mkdir -p artifacts/
          mv ../mg2a_*.deb artifacts/
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-debian
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ tarball, debian ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setting release variables ...
        id: build
        run: |
          ver=${GITHUB_REF#refs/tags/}
          echo "ver=${ver}" >> $GITHUB_OUTPUT
          if echo $ver | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-alpha|-beta|-rc)[0-9]*$'; then
            echo "pre=true"  >> $GITHUB_OUTPUT
          else
            echo "pre=false" >> $GITHUB_OUTPUT
          fi
          if echo $ver | grep -qE '^v[0-9.]+\.[0-9.]+(\.[0-9]+)?$'; then
            echo "latest=true"  >> $GITHUB_OUTPUT
          else
            echo "latest=false" >> $GITHUB_OUTPUT
          fi
      - name: Download artifacts ...
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Extract ChangeLog entry ...
        run: |
          awk '/-----*/{if (x == 1) exit; x=1;next}x' ChangeLog.md \
              |head -n -1 > release.md
          cat release.md
      - uses: ncipollo/release-action@v1
        with:
          name: Mg ${{ github.ref_name }}
          prerelease: ${{ steps.build.outputs.pre }}
          makeLatest: ${{ steps.build.outputs.latest }}
          bodyFile: "release.md"
          artifacts: "artifacts/*"
